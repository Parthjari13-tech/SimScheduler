apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.simscheduler'
    compileSdk 34

    defaultConfig {
        applicationId "com.simscheduler"
        minSdk 21
        targetSdk 34
        versionCode = project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1
        versionName = project.hasProperty('versionName') ? project.property('versionName') : "1.0.0"
    }

    buildTypes {
        debug { versionNameSuffix "-debug" }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions { jvmTarget = '1.8' }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // ViewPager2 for tabs
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    // Fragment support
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
}
